name: Spillway Alerts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spillway-monitor
  cancel-in-progress: true

jobs:
  check-spillways:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check spillways
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Send service restored notice
        if: ${{ hashFiles('.service_restored_notice_sent') == '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS \
            -H "Title: Spillway Alerts Restored" \
            -H "Priority: high" \
            -H "Tags: white_check_mark" \
            -d "All technical difficulties have been resolved. We apologize for the inconvenience. Spillway Alerts are fully operational again." \
            "https://ntfy.sh/${NTFY_TOPIC}"
          touch .service_restored_notice_sent

      - name: Save spillway state and history
        run: |
          if [[ -n "$(git status --porcelain state.json spillway_history.json .service_restored_notice_sent)" ]]; then
            git config user.name "spillway-alert-bot"
            git config user.email "spillway-alert-bot@users.noreply.github.com"
            git add state.json spillway_history.json .service_restored_notice_sent
            git commit -m "Update spillway state and history"
            git push
          else
            echo "No state or history change."
          fi
