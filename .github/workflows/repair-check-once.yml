name: One-time Repair Check
# Verification after switching ntfy to JSON publishing
on:
  push:
    paths:
      - '.github/workflows/repair-check-once.yml'
permissions:
  contents: write
concurrency:
  group: spillway-monitor
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and run spillway monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python -m py_compile monitor.py
          python -u monitor.py
      - name: Persist state/history
        run: |
          if [[ -n "$(git status --porcelain state.json spillway_history.json)" ]]; then
            git config user.name "spillway-alert-bot"
            git config user.email "spillway-alert-bot@users.noreply.github.com"
            git add state.json spillway_history.json
            git commit -m "Update spillway state and history"
            git push
          fi
