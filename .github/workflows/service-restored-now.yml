name: Service Restored Notice

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/service-restored-now.yml"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify subscribers
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS \
            -H "Title: Spillway Alerts Restored" \
            -H "Priority: high" \
            -H "Tags: white_check_mark" \
            -d "All technical difficulties have been resolved. We apologize for the inconvenience. Spillway Alerts are fully operational again." \
            "https://ntfy.sh/${NTFY_TOPIC}"
